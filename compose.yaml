services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=production_archive
      - POSTGRES_USER=archive_user
      - POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_user -d production_archive"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
